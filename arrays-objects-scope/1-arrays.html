<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1. Arrays - Arrays, objects and scope</title>
  <!-- Official Bootstrap 5, same as form-systems and feed-demo -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/shell.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="js/show-code.js" defer></script>
  <script src="js/1-arrays.js" defer></script>
</head>
<body>
  <nav class="sidebar" aria-label="Examples">
    <h1>Arrays, objects and scope</h1>
    <ul class="nav nav-pills flex-column">
      <li class="nav-item"><a class="nav-link active" aria-current="page" href="1-arrays.html">1. Arrays</a></li>
      <li class="nav-item"><a class="nav-link" href="2-objects.html">2. Objects</a></li>
      <li class="nav-item"><a class="nav-link" href="3-array-methods.html">3. Loops and Arrays</a></li>
      <li class="nav-item"><a class="nav-link" href="5-one-post.html">4. One object, one post</a></li>
      <li class="nav-item"><a class="nav-link" href="6-posts.html">5. An array of posts</a></li>
    </ul>
  </nav>

  <main class="stage">
    <div class="accordion" id="steps">
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#step-load" aria-expanded="true" aria-controls="step-load">Load the array</button>
        </h2>
        <div id="step-load" class="accordion-collapse collapse show" data-bs-parent="#steps">
          <div class="accordion-body">
            <div id="load-row" class="box-row"></div>
            <div class="buttons">
              <button id="load" class="btn btn-primary btn-lg" type="button">Load next box</button>
              <button id="load-reset" class="btn btn-outline-primary btn-lg" type="button">Start over</button>
            </div>
            <pre id="code-load" class="code"></pre>
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#step-add" aria-expanded="false" aria-controls="step-add">Add to the front and the end</button>
        </h2>
        <div id="step-add" class="accordion-collapse collapse" data-bs-parent="#steps">
          <div class="accordion-body">
            <div id="add-row" class="box-row"></div>
            <p class="array-line"></p>
            <div class="button-columns">
              <div>
                <button id="add-in-front" class="btn btn-primary btn-lg" type="button">Add in front</button>
                <pre id="code-front" class="code"></pre>
              </div>
              <div>
                <button id="add-at-end" class="btn btn-primary btn-lg" type="button">Add at the end</button>
                <pre id="code-end" class="code"></pre>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#step-foreach" aria-expanded="false" aria-controls="step-foreach">Change every box with forEach</button>
        </h2>
        <div id="step-foreach" class="accordion-collapse collapse" data-bs-parent="#steps">
          <div class="accordion-body">
            <div id="paint-row" class="box-row"></div>
            <p class="array-line"></p>
            <div class="buttons">
              <button id="paint" class="btn btn-primary btn-lg" type="button">Paint with forEach</button>
              <button id="refresh" class="btn btn-outline-primary btn-lg" type="button">Refresh</button>
            </div>
            <pre id="code-paint" class="code"></pre>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
