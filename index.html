        <div class="top-block">
          <header>
            <a href="#init" class="header-link">
              <div class="heat-wave-container" id="heatContainer">
                <svg
                  class="heat-wave-svg"
                  xmlns="http://www.w3.org/2000/svg"
                  viewBox="0 0 420 120"
                >
                  <defs>
                    <filter
                      id="heatwave"
                      primitiveUnits="objectBoundingBox"
                      x="-50%"
                      y="-50%"
                      width="200%"
                      height="200%"
                    >
                      <!-- Heat wave displacement filter -->
                      <feTurbulence
                        type="fractalNoise"
                        baseFrequency="0 0.05"
                        numOctaves="1"
                        result="warp"
                        seed="42"
                      />

                      <feOffset
                        in="warp"
                        dx="0"
                        dy="-.5"
                        id="offset1"
                        result="offset1"
                      />
                      <feOffset
                        in="warp"
                        dx="0"
                        dy=".5"
                        id="offset2"
                        result="offset2"
                      />

                      <feMerge result="merged">
                        <feMergeNode in="offset1" />
                        <feMergeNode in="offset2" />
                      </feMerge>

                      <feGaussianBlur stdDeviation=".01" result="blur" />
                      <feDisplacementMap
                        xChannelSelector="R"
                        yChannelSelector="G"
                        scale=".05"
                        in="SourceGraphic"
                        result="displaced"
                      />
                    </filter>
                  </defs>

                  <text
                    x="0"
                    y="100%"
                    text-anchor="left"
                    class="heat-wave-text"
                  >
                    Alex Leitch
                  </text>
                </svg>
              </div>
              <h1>Alex Leitch</h1>
              <h2></h2>
