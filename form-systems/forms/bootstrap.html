<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio sign-up — Bootstrap</title>
  <!-- Official Bootstrap 5 stylesheet, with no styling of our own. Same native inputs as
       the unstyled form, with Bootstrap's classes added: form-* for the
       controls, and container / row / col-* for its 12-column grid. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <!-- Inspection aid for the "Show grids" button; not part of the design system -->
  <link rel="stylesheet" href="../css/grid-overlay.css">
  <script src="../js/grid-overlay.js" defer></script>
</head>
<body>
  <main class="container py-4">
    <h1>Studio sign-up</h1>
    <p class="lead">Reserve a seat in the grids workshop.</p>

    <form>
      <!-- One 12-column row. Columns stack on small screens and wrap onto a
           new line whenever a line's spans add up to 12. g-3 sets the gutter. -->
      <div id="form-grid" class="row g-3">
        <div class="col-md-6">
          <label class="form-label" for="name">Full name</label>
          <input class="form-control" id="name" name="name" type="text" autocomplete="name" required>
        </div>

        <div class="col-md-6">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="col-md-4">
          <label class="form-label" for="date">Preferred date</label>
          <input class="form-control" id="date" name="date" type="date" value="2026-10-13">
        </div>

        <div class="col-md-8">
          <label class="form-label" for="section">Section</label>
          <select class="form-select" id="section" name="section">
            <option value="0101">0101 — Tuesday morning</option>
            <option value="0102">0102 — Tuesday afternoon</option>
            <option value="0103">0103 — Thursday morning</option>
          </select>
        </div>

        <fieldset class="col-md-6">
          <legend class="form-label fs-6">Design experience</legend>
          <div class="form-check">
            <input class="form-check-input" id="experience-new" name="experience" type="radio" value="new" checked>
            <label class="form-check-label" for="experience-new">New</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" id="experience-some" name="experience" type="radio" value="some">
            <label class="form-check-label" for="experience-some">Some</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" id="experience-lots" name="experience" type="radio" value="lots">
            <label class="form-check-label" for="experience-lots">Lots</label>
          </div>
        </fieldset>

        <fieldset class="col-md-6">
          <legend class="form-label fs-6">Tools you will bring</legend>
          <div class="form-check">
            <input class="form-check-input" id="tool-paper" name="tools" type="checkbox" value="paper" checked>
            <label class="form-check-label" for="tool-paper">Paper and pencil</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" id="tool-figma" name="tools" type="checkbox" value="figma">
            <label class="form-check-label" for="tool-figma">Figma</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" id="tool-illustrator" name="tools" type="checkbox" value="illustrator">
            <label class="form-check-label" for="tool-illustrator">Illustrator</label>
          </div>
        </fieldset>

        <div class="col-md-6">
          <label class="form-label" for="confidence">Confidence with grids</label>
          <input class="form-range" id="confidence" name="confidence" type="range" min="0" max="10" value="5">
        </div>

        <div class="col-md-6">
          <label class="form-label" for="sketch">Upload a sketch</label>
          <input class="form-control" id="sketch" name="sketch" type="file" accept="image/*,.pdf">
        </div>

        <div class="col-12">
          <label class="form-label" for="notes">Notes</label>
          <textarea class="form-control" id="notes" name="notes" rows="4"></textarea>
        </div>

        <div class="col-12">
          <button class="btn btn-primary" type="submit">Sign up</button>
          <button class="btn btn-outline-secondary" type="reset">Reset</button>
        </div>
      </div>
    </form>
  </main>
</body>
</html>
